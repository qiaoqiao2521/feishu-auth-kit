name: Slack continuity offline checks
on:
  pull_request:
  push:
    branches: [main, 'dot/slack-continuity-*']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev --extra transport
      - run: uv run --frozen --extra dev --extra transport pytest -q
      - run: uv run --frozen --extra dev --extra transport ruff check src/feishu_auth_kit/slack*.py tests/test_slack*.py
  typescript-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
