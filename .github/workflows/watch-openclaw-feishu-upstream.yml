name: Watch OpenClaw Feishu Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (do not create or patch GitHub issues)"
        required: false
        default: false
        type: boolean
      cycle:
        description: "Digest cycle window"
        required: false
        default: "weekly"
        type: choice
        options:
          - weekly
          - monthly
          - rolling
      lookback_days:
        description: "Lookback days when no cursor exists"
        required: false
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: watch-openclaw-feishu-upstream
  cancel-in-progress: false

jobs:
  upstream-watch:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Restore upstream watch state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .upstream-watch/state.json
          key: upstream-watch-state-${{ github.run_id }}
          restore-keys: |
            upstream-watch-state-

      - name: Run upstream watcher
        env:
          WATCH_DRY_RUN: ${{ inputs.dry_run }}
          WATCH_CYCLE: ${{ inputs.cycle || 'weekly' }}
          WATCH_LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--cycle "$WATCH_CYCLE" --lookback-days "$WATCH_LOOKBACK_DAYS")
          if [ "$WATCH_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/upstream_watch.py "${args[@]}"
