name: Product contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra dev --extra transport --python "${{ matrix.python }}"
          pnpm install --frozen-lockfile
      - name: Offline Python contracts and scoped lint
        run: |
          uv run --frozen --extra dev --extra transport pytest -q
          uv run --frozen --extra dev --extra transport ruff check src tests --exclude tests/test_upstream_watch.py
      - name: Offline TypeScript contracts and build
        env:
          FEISHU_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          pnpm test
          pnpm run typecheck
          pnpm run build
      - name: Verify base authentication install without transport
        env:
          UV_PROJECT_ENVIRONMENT: .venv-core
        run: |
          uv sync --frozen --python "${{ matrix.python }}"
          .venv-core/bin/python -c "import sys; import feishu_auth_kit; assert 'cryptography' not in sys.modules; assert 'lark_oapi' not in sys.modules"
