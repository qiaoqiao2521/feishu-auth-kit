name: Product contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra dev --extra transport --python "${{ matrix.python }}"
          pnpm install --frozen-lockfile
      - name: Offline Python contracts and scoped lint
        run: |
          uv run --frozen --extra dev --extra transport pytest -q
          uv run --frozen --extra dev --extra transport ruff check src tests --exclude tests/test_upstream_watch.py
      - name: Offline TypeScript contracts and build
        env:
          FEISHU_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          pnpm test
          pnpm run typecheck
          pnpm run build
      - name: Verify base authentication install without transport
        env:
          UV_PROJECT_ENVIRONMENT: .venv-core
        run: |
          uv sync --frozen --python "${{ matrix.python }}"
          .venv-core/bin/python -c "import sys; import feishu_auth_kit; assert 'cryptography' not in sys.modules; assert 'lark_oapi' not in sys.modules"
