name: Slack continuity offline checks
on:
  pull_request:
  push:
    branches: [main, 'dot/slack-continuity-*']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev --extra transport
      - run: uv run --frozen --extra dev --extra transport pytest -q
      - run: uv run --frozen --extra dev --extra transport ruff check src/feishu_auth_kit/slack*.py tests/test_slack*.py
  typescript-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
